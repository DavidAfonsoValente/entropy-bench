name: Bug report
description: Report a reproducible problem in evaluation, adaptation, or reporting
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and minimal reproduction
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, Transformers, PEFT, CUDA, GPU, and operating system.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, private data, and machine-specific secrets.
      render: text
