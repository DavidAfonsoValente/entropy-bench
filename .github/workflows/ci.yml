name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate leaderboard JSON and Markdown
        run: |
          python lm_adapt_bench/leaderboard.py validate
          python lm_adapt_bench/leaderboard.py render --check
      - name: Validate citation metadata
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Run CPU test suite
        run: pytest -q
