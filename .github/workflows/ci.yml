name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job that runs exactly the gate CONTRIBUTING.md tells contributors to run.
  #
  # This used to enumerate a subset of the --check targets by hand, and the list went stale: by
  # 2026-08-30 it was missing the adapted-benchmark, E2 confound, pairwise-significance and
  # selection-divergence artifacts, so CI would go green on a pull request that left any of them
  # inconsistent with the committed results. Invoking `make check` means the documented contributor
  # command and the enforced gate cannot drift apart again -- adding a target to the Makefile is
  # now sufficient to have CI enforce it.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test extras
        run: python -m pip install -e '.[test]'
      - name: Run the full gate (make check)
        # PYTHON is overridden because the Makefile prefers a local virtualenv that does not
        # exist here; without it the analysis steps would run on a bare interpreter with no deps.
        run: make check PYTHON=python
      - name: Validate citation metadata
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"
