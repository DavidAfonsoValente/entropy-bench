# Hardened SoTA Search Space
# Optimized for 40GB A100 / H100 hardware

learning_rate:
  type: float
  log: true
  low: 1.0e-6    # Lowered from 1e-5 to fix Qwen/LFM divergence
  high: 1.0e-3   # Increased to check for high-speed adapters

batch_size:
  type: categorical
  choices: [2, 4, 8] # Lower physical batch to GUARANTEE no OOMs

gradient_accumulation_steps:
  type: categorical
  choices: [1, 2, 4, 8, 16] # Higher accumulation to reach Effective Batch 128

warmup_ratio:
  type: float
  low: 0.0
  high: 0.2

weight_decay:
  type: float
  log: true
  low: 1.0e-5
  high: 0.1

lora_r:
  type: categorical
  choices: [8, 16, 32, 64] # Increased max rank for high-capacity learning

lora_alpha_multiplier:
  type: categorical
  choices: [1, 2, 4]
  lora_only: true

lora_dropout:
  type: float
  low: 0.0
  high: 0.2
  lora_only: true
